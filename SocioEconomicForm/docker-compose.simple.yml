# ========================================
# SeguroPro / Opportunizze
# Docker Compose Simples (sem Traefik)
# Para uso com Nginx reverso externo
# ========================================

version: '3.8'

services:
  # ========================================
  # Application Service
  # ========================================
  app:
    image: ghcr.io/acelmec/opportunizze:latest
    container_name: opportunizze-app
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ========================================
  # PostgreSQL Database
  # ========================================
  db:
    image: postgres:15-alpine
    container_name: opportunizze-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seguropro}
      POSTGRES_USER: ${POSTGRES_USER:-seguropro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seguropro} -d ${POSTGRES_DB:-seguropro}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

# ========================================
# Exemplo de .env para este compose:
# ========================================
# DATABASE_URL=postgresql://seguropro:SENHA@db:5432/seguropro
# SESSION_SECRET=sua-chave-secreta-muito-longa
# POSTGRES_DB=seguropro
# POSTGRES_USER=seguropro
# POSTGRES_PASSWORD=SENHA
# ========================================
