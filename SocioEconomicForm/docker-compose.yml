# ========================================
# SeguroPro / Opportunizze
# Docker Compose for Docker Swarm + Traefik
# Domain: opportunizze.amsolucoes.net.br
# ========================================

version: '3.8'

secrets:
  database_url:
    external: true
  session_secret:
    external: true
  db_password:
    external: true

services:
  # ========================================
  # Application Service
  # ========================================
  app:
    image: ghcr.io/acelmec/opportunizze:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL=$$(cat /run/secrets/database_url)
        export SESSION_SECRET=$$(cat /run/secrets/session_secret)
        exec node dist/index.cjs
    environment:
      NODE_ENV: production
      PORT: 5000
    secrets:
      - database_url
      - session_secret
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        # Traefik Configuration
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        
        # HTTP Router (redirect to HTTPS)
        - "traefik.http.routers.opportunizze-http.rule=Host(`opportunizze.amsolucoes.net.br`)"
        - "traefik.http.routers.opportunizze-http.entrypoints=web"
        - "traefik.http.routers.opportunizze-http.middlewares=https-redirect"
        
        # HTTPS Router
        - "traefik.http.routers.opportunizze.rule=Host(`opportunizze.amsolucoes.net.br`)"
        - "traefik.http.routers.opportunizze.entrypoints=websecure"
        - "traefik.http.routers.opportunizze.tls=true"
        - "traefik.http.routers.opportunizze.tls.certresolver=letsencrypt"
        
        # Service Configuration
        - "traefik.http.services.opportunizze.loadbalancer.server.port=5000"
        - "traefik.http.services.opportunizze.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.opportunizze.loadbalancer.sticky.cookie.name=opportunizze_session"
        - "traefik.http.services.opportunizze.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.opportunizze.loadbalancer.healthcheck.interval=30s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # PostgreSQL Database
  # ========================================
  db:
    image: postgres:15-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PASSWORD=$$(cat /run/secrets/db_password)
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: seguropro
      POSTGRES_USER: seguropro
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguropro -d seguropro"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
